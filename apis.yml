name: AVORA Agent Forge
description: >-
  AVORA Agent Forge is an evidence-first Solana SPL token risk scanner and public AI
  interoperability service built for humans, wallets, and autonomous agents. It publishes two
  OpenAPI 3.1 REST APIs, a hosted streamable-HTTP MCP server whose tools/list responds
  anonymously with eleven fully-schemad tools, and an A2A agent card with three published
  skills. Every operation is unauthenticated: there are no accounts, no API keys, and no OAuth.
  Paid tiers are gated instead by non-custodial, user-signed Solana Pay (USDC) settlement
  verified on-chain, where the payment reference doubles as the idempotency key. Public-sector
  assessments return Ed25519 JWS receipts that any third party can verify offline against a
  published JWKS, and the service ships a voluntary NIST AI RMF alignment profile that
  explicitly disclaims certification and government approval and requires human review.
